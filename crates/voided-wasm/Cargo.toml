[package]
name = "voided-wasm"
version = "0.2.2"
edition = "2021"
authors = ["Voided Team"]
description = "WebAssembly binding for voided-core encryption library"
license = "MIT"
repository = "https://github.com/voided-network/voided"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
voided-core = { version = "0.2.3", path = "../voided-core", features = ["browser"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.21"
hex = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# wasm-opt currently fails to validate modern wasm features emitted by this toolchain
# in this environment (bulk-memory/nontrapping-f2i). Keep wasm-pack deterministic by
# skipping wasm-opt; Rust release optimization and LTO still apply.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Profile settings are defined in workspace root (crates/Cargo.toml)

