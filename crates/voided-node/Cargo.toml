[package]
name = "voided-node"
version = "0.2.0"
edition = "2021"
authors = ["Voided Team"]
description = "Node.js native binding for voided-core encryption library"
license = "MIT"
repository = "https://github.com/voided-network/voided"

[lib]
crate-type = ["cdylib"]

[dependencies]
voided-core = { version = "0.2.0", path = "../voided-core", features = ["backend"] }
napi = { version = "2.14", features = ["napi9", "serde-json"] }
napi-derive = "2.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.21"

[build-dependencies]
napi-build = "=2.1.3"

# Profile settings are defined in workspace root (crates/Cargo.toml)

