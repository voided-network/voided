[package]
name = "voided-core"
version = "1.0.1"
edition = "2021"
authors = ["Voided Team"]
description = "Core cryptographic primitives for the Voided encryption library"
license = "MIT"
repository = "https://github.com/voided-network/voided"
keywords = ["encryption", "cryptography", "aead", "security"]
categories = ["cryptography", "encoding"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES",
]

[lib]
# The Node and WASM binding crates own their dynamic-library outputs.
crate-type = ["rlib"]

[features]
default = ["backend"]

# Full feature set for Node.js backend binding
backend = ["compression", "signing", "std"]

# Browser-compatible subset for WASM. The in-memory compression codecs use
# std::io, which is available on wasm32-unknown-unknown.
browser = ["compression", "wasm", "std"]

# Individual feature flags
compression = ["brotli", "flate2", "std"]
signing = ["ed25519-dalek", "p256", "std"]
wasm = ["getrandom/js", "wasm-bindgen"]
std = ["rand/std", "rand/std_rng", "sha2/std", "base64/std", "hex/std", "serde/std", "serde_json/std", "thiserror/std"]
# Unsupported bare-metal targets must register their own cryptographic entropy
# implementation through getrandom; no fallback entropy source is supplied.
custom-rng = ["getrandom/custom"]

[dependencies]
# Core crypto - always included
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = { version = "0.10", default-features = false }
hmac = "0.12"
x25519-dalek = "2.0"

# Random number generation
rand = { version = "0.8", default-features = false, features = ["alloc", "getrandom"] }
getrandom = { version = "0.2", optional = true }

# Compression (optional)
brotli = { version = "3.3", optional = true }
flate2 = { version = "1.0", optional = true }

# Signing (optional, backend only)
ed25519-dalek = { version = "2.1", features = ["rand_core", "pem"], optional = true }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem"], optional = true }

# Encoding
base64 = { version = "0.21", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Security
zeroize = { version = "1.7", features = ["derive"] }
constant_time_eq = "0.3"

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }

# Error handling
thiserror = { version = "2.0", default-features = false }

# RustCrypto checks CPU support at runtime and retains its software fallback.
# Other targets (including WASM) retain their existing dependency features.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["asm"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
hex-literal = "0.4"

# Benchmarks (uncomment when benches directory is created)
# [[bench]]
# name = "crypto_benchmarks"
# harness = false

# Profile settings are defined in workspace root (crates/Cargo.toml)
